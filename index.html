<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0078D4, #6A5ACD);
    color: white;
    text-align: center;
}

.container {
    padding: 50px 20px;
}

h1 {
    font-size: 3rem;
}

.card {
    max-width: 800px;
    margin: auto;
    background: rgba(255,255,255,0.15);
    padding: 25px;
    border-radius: 15px;
}

img {
    width: 250px;
    height: 250px;
    border-radius: 15px;
    margin: 20px 0;
    object-fit: cover;
}

button {
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: #FFD700;
    color: black;
    cursor: pointer;
    font-size: 1rem;
}

button:hover {
    background: white;
}

#message {
    margin-top: 20px;
    font-size: 1.2rem;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <h1>🚀 Start My HTML Journey</h1>

    <div class="card">

        <h2>This Is My Portfolio</h2>

        <imgs://via.placeholder.com/250

        <p>
            Welcome to my portfolio website.
            I am learning HTML, CSS, and JavaScript.
            This website is part of my journey to become a better web developer.
        </p>

        <button onclick="startJourney()">Start My Journey</button>

        <div id="message"></div>

    </div>

</div>

<script>
function startJourney() {
    document.getElementById("message").innerHTML =
    "✅ My HTML Journey Has Started!";
}
</script>

</body>
</html>
